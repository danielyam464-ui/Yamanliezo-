<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMANLIEZO</title>
<style>
body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:Arial}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1}
.box{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center;pointer-events:none}
h1{font-size:60px;letter-spacing:15px;margin:0;text-shadow:0 0 20px #8a2be2;pointer-events:auto}
p{letter-spacing:4px;margin-top:10px;font-style:italic}
a{margin-top:30px;padding:14px 40px;border:1px solid white;color:white;text-decoration:none;letter-spacing:4px;pointer-events:auto;background:rgba(0,0,0,0.3)}
#frases{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
.frase{position:absolute;color:rgba(255,255,255,0.8);font-style:italic;text-shadow:0 0 8px #8a2be2;animation:flotar 4s forwards}
@keyframes flotar{0%{opacity:0;transform:translateY(20px)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
</style>
</head>
<body>

<video id="bg" autoplay loop muted playsinline>
<source src="https://videos.pexels.com/video-files/3048527/3048527-uhd_2560_1440_30fps.mp4" type="video/mp4">
</video>

<audio id="audio" autoplay loop>
<source src="https://files.catbox.moe/imbkg0.mp4" type="video/mp4">
</audio>

<div class="overlay"></div>
<div id="frases"></div>

<div class="box">
<h1>YAMANLIEZO</h1>
<p>joven filósofo</p>
<a href="https://sites.google.com/view/yamanliezo-el-inicio">ENTRAR A LA WEB</a>
</div>

<script>
let frases=["¿Quién eres?","¿De dónde vienes?","¿A dónde vamos?","¿Qué sientes?","¿Quiénes somos?","¿Qué es el todo?","¿Te sientes bien?","¿Qué buscas?"];
let cont=document.getElementById('frases');
function crear(){
 let d=document.createElement('div');
 d.className='frase';
 d.innerText=frases[Math.floor(Math.random()*frases.length)];
 d.style.left=Math.random()*70+5+'%';
 d.style.top=Math.random()*70+10+'%';
 d.style.fontSize=(0.9+Math.random()*0.6)+'rem';
 cont.appendChild(d);
 setTimeout(()=>d.remove(),4000);
}
setInterval(crear,700);

let a=document.getElementById('audio');
function sonar(){a.volume=1;a.play().catch(()=>{});}
window.onload=sonar;
document.body.addEventListener('click',sonar,{once:true});
setTimeout(sonar,500);
</script>

</body>
</html>
