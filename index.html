<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMANLIEZO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;overflow:hidden;font-family:Arial}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:1}
.contenido{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center}
h1{font-size:6rem;letter-spacing:18px;font-weight:900;text-shadow:0 0 30px #8a2be2}
.sub{font-size:1.4rem;letter-spacing:4px;margin-top:10px;font-style:italic}
.btn{margin-top:40px;padding:15px 50px;border:1px solid white;color:white;text-decoration:none;letter-spacing:5px;background:rgba(0,0,0,0.3)}
</style>
</head>
<body>

<video id="bg" autoplay loop muted playsinline controlslist="nodownload" crossorigin="anonymous">
<source src="https://files.catbox.moe/imbkg0.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="contenido">
<h1>YAMANLIEZO</h1>
<div class="sub">joven filósofo</div>
<a class="btn" href="https://sites.google.com/view/yamanliezo-el-inicio">ENTRAR A LA WEB</a>
</div>

<script>
let v = document.getElementById('bg');
v.addEventListener('canplay', ()=>{
 v.muted = false;
 v.volume = 1;
 v.play();
});
document.body.addEventListener('click', ()=>{
 v.muted = false;
 v.play();
}, {once:true});
</script>

</body>
</html>
