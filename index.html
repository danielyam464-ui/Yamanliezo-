<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMANLIEZO</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#000 0%,#1a0033 50%,#4b0082 100%);color:white;font-family:Arial;text-align:center;padding:20px}
h1{font-size:4rem;letter-spacing:10px;margin:0;font-weight:900}
p{font-size:1.2rem;margin-top:10px;opacity:.8;letter-spacing:2px;font-style:italic}
#video{margin-top:30px;width:325px;min-height:580px;border-radius:15px;border:2px solid #6a0dad;overflow:hidden}
</style>
</head>
<body>
<h1>YAMANLIEZO</h1>
<p>joven filosófico yamanliezo</p>

<div id="video"></div>

<script>
fetch('https://www.tiktok.com/oembed?url=https://vt.tiktok.com/ZSqvyE7EF/')
.then(r=>r.json())
.then(data=>{
document.getElementById('video').innerHTML = data.html;
let s = document.createElement('script');
s.src='https://www.tiktok.com/embed.js';
document.body.appendChild(s);
})
</script>

</body>
</html>
