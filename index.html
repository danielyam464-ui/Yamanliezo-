<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YAMANLIEZO</title>
</head>
<body style="background:black;margin:0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center;font-family:Arial;">

<h1 style="font-size:50px;letter-spacing:10px;margin:0;">YAMANLIEZO</h1>
<p style="color:#d8b4fe;margin-top:10px;">Un pensamiento más que nadie ve, solo tú</p>
<p id="c" style="margin-top:20px;opacity:0.6;">REDIRIGIENDO EN 10...</p>

<script>
// preguntas flotando
var frases=["¿quién eres?","¿qué es nada?","¿qué es todo?","¿te conoces?","¿qué buscas?","solo sé que nada sé","¿a dónde vas?"];
setInterval(function(){
  var p=document.createElement("div");
  p.textContent=frases[Math.floor(Math.random()*frases.length)];
  p.style.position="fixed";
  p.style.left=Math.random()*80+"%";
  p.style.top=Math.random()*80+"%";
  p.style.color="white";
  p.style.opacity="0.7";
  p.style.fontStyle="italic";
  document.body.appendChild(p);
  setTimeout(function(){p.remove()},2000);
},500);

// contador
var n=10;
setInterval(function(){
  n--;
  document.getElementById("c").textContent="REDIRIGIENDO EN "+n+"...";
  if(n<=0) window.location.href="https://sites.google.com/view/yamanliezo-el-inicio";
},1000);
</script>

</body>
</html>
