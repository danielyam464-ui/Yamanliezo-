<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAMANLIEZO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a001a;height:100vh;overflow:hidden;font-family:Arial}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#0a001a}
.fallback{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:radial-gradient(circle at 50% 50%, #2a0a4a 0%, #0a001a 70%);display:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1}
.box{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center;padding:20px}
h1{font-size:5.5rem;letter-spacing:15px;font-weight:900;text-shadow:0 0 25px #8a2be2}
.frase{margin-top:15px;font-size:1.25rem;letter-spacing:3px;font-style:italic;opacity:0.9}
.btn{margin-top:35px;padding:15px 50px;border:1px solid white;color:white;text-decoration:none;letter-spacing:5px;background:rgba(0,0,0,0.4)}
</style>
</head>
<body>

<video id="bg" autoplay loop muted playsinline crossorigin="anonymous">
<source src="https://files.catbox.moe/zhkp8y.mp4" type="video/mp4">
</video>

<div class="fallback" id="fallback"></div>
<div class="overlay"></div>

<div class="box">
<h1>YAMANLIEZO</h1>
<div class="frase">joven que es nada y todo para el</div>
<a class="btn" href="https://sites.google.com/view/yamanliezo-el-inicio">ENTRAR A LA WEB</a>
</div>

<script>
const v = document.getElementById('bg');
const fb = document.getElementById('fallback');

function activar(){
 v.muted = false;
 v.volume = 1;
 v.play().catch(()=>{
   v.muted = true;
   v.play();
   document.body.addEventListener('click',()=>{
     v.muted=false;
     v.volume=1;
     v.play();
     fb.style.display='none';
   },{once:true});
 });
}

v.addEventListener('error', ()=>{
  fb.style.display='block';
  console.log('video catbox fallo, mostrando fondo');
});

v.addEventListener('canplay', ()=>{
  fb.style.display='none';
});

window.addEventListener('load', activar);
setTimeout(activar, 800);
</script>

</body>
</html>
